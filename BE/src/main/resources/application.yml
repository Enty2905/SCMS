server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/scms/api}

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/scms_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      connection-init-sql: SET time_zone = '${MYSQL_SESSION_TIME_ZONE:+07:00}'

  jackson:
    time-zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

jwt:
  signerKey: ${JWT_SECRET}
  valid-duration: ${JWT_VALID_DURATION:86400}
  refreshable-duration: ${JWT_REFRESHABLE_DURATION:604800}

logging:
  level:
    com.scms: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

app:
  name: ${APP_NAME:SCMS}
  description: ${APP_DESCRIPTION:Hệ thống quản lý vận hành và bảo trì}
  version: ${APP_VERSION:1.0.0}
  team-name: ${APP_TEAM_NAME:SCMS Team}
  contact-email: ${APP_CONTACT_EMAIL:scms-team@example.com}
  time-zone: ${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
  email-domain: ${EMPLOYEE_EMAIL_DOMAIN:nhm.vn}
  company:
    name: ${COMPANY_NAME:Nhà máy Nhiệt điện}
    owner: ${COMPANY_OWNER:CÔNG TY SCMS}
    repair: ${COMPANY_REPAIR:CTY CP SCMS}
    request: ${COMPANY_REQUEST:CÔNG TY SCMS}
    work-order-unit: ${WORK_ORDER_UNIT:SCMS MAINTENANCE}
  cors:
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*}"
  upload:
    pdf-dir: ${PDF_UPLOAD_DIR:uploads/pdf}
    employee-avatar-dir: ${EMPLOYEE_AVATAR_DIR:uploads/employees}
  cloudinary-folder:
    employees: ${CLOUDINARY_EMPLOYEE_FOLDER:scms/employees}
    equipment: ${CLOUDINARY_EQUIPMENT_FOLDER:scms/equipment}
    work-orders: ${CLOUDINARY_WORK_ORDER_FOLDER:scms/work-orders}
    assessments: ${CLOUDINARY_ASSESSMENT_FOLDER:scms/assessments}
    consumable-requests: ${CLOUDINARY_CONSUMABLE_REQUEST_FOLDER:scms/consumable-requests}
    spare-part-requests: ${CLOUDINARY_SPARE_PART_REQUEST_FOLDER:scms/spare-part-requests}
    chat: ${CLOUDINARY_CHAT_FOLDER:scms/chat}
  chat:
    attachment:
      max-size: ${CHAT_ATTACHMENT_MAX_SIZE:20971520}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
