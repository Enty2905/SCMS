server:
  port: 8081
  servlet:
    context-path: /scms/api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/scms_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  signerKey: scms-super-secret-key-supply-chain-management-system-2024-very-long-for-hs512-at-least-64bytes
  valid-duration: 86400       # 1 ngày (giây)
  refreshable-duration: 604800 # 7 ngày (giây)

logging:
  level:
    com.scms: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
app:
  upload:
    pdf-dir: uploads/pdf
    employee-avatar-dir: uploads/employees

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dtayjf0fi}
  api-key: ${CLOUDINARY_API_KEY:773119296171951}
  api-secret: ${CLOUDINARY_API_SECRET:N7heEmm8WrLNM4g5sbR-1yujiJw}
