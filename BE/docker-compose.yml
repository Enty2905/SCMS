services:
  mysql_db:
    image: mysql:8.0.40
    restart: unless-stopped
    container_name: scms_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scms_db}
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    container_name: scms_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: ${PMA_HOST:-mysql_db}
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      - mysql_db
    networks:
      - backend

  scms:
    build:
      context: .
      dockerfile: Dockerfile
    #    image: your-dockerhub/scms-be:latest  # uncomment khi push lên Docker Hub
    container_name: scms_be
    platform: linux/amd64
    ports:
      - "8081:8081"
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8081}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PATH: ${LOG_PATH:-/var/log/scms}
    volumes:
      - scms_logs:/var/log/scms
      - ./uploads:/app/uploads
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_data:
  scms_logs:
