services:
  mysql_db:
    image: mysql:8.0.40
    restart: unless-stopped
    container_name: ${MYSQL_CONTAINER_NAME:-scms_mysql_db}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scms_db}
      TZ: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=${MYSQL_SESSION_TIME_ZONE:-+07:00}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    container_name: ${PHPMYADMIN_CONTAINER_NAME:-scms_phpmyadmin}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: ${PMA_HOST:-mysql_db}
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
    depends_on:
      - mysql_db
    networks:
      - backend


  scms:
    build:
      context: .
      dockerfile: Dockerfile
    #    image: your-dockerhub/scms-be:latest  # uncomment khi push lên Docker Hub
    container_name: ${BE_CONTAINER_NAME:-scms_be}
    platform: linux/amd64
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8081}
      SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH:-/scms/api}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_VALID_DURATION: ${JWT_VALID_DURATION:-86400}
      JWT_REFRESHABLE_DURATION: ${JWT_REFRESHABLE_DURATION:-604800}
      APP_NAME: ${APP_NAME:-SCMS}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-Hệ thống quản lý vận hành và bảo trì}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_TEAM_NAME: ${APP_TEAM_NAME:-SCMS Team}
      APP_CONTACT_EMAIL: ${APP_CONTACT_EMAIL:-scms-team@example.com}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      COMPANY_NAME: ${COMPANY_NAME:-Nhà máy Nhiệt điện}
      COMPANY_OWNER: ${COMPANY_OWNER:-CÔNG TY SCMS}
      COMPANY_REPAIR: ${COMPANY_REPAIR:-CTY CP SCMS}
      COMPANY_REQUEST: ${COMPANY_REQUEST:-CÔNG TY SCMS}
      WORK_ORDER_UNIT: ${WORK_ORDER_UNIT:-SCMS MAINTENANCE}
      EMPLOYEE_EMAIL_DOMAIN: ${EMPLOYEE_EMAIL_DOMAIN:-nhm.vn}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-5}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-30000}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      MYSQL_SESSION_TIME_ZONE: ${MYSQL_SESSION_TIME_ZONE:-+07:00}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_EMPLOYEE_FOLDER: ${CLOUDINARY_EMPLOYEE_FOLDER:-scms/employees}
      CLOUDINARY_EQUIPMENT_FOLDER: ${CLOUDINARY_EQUIPMENT_FOLDER:-scms/equipment}
      CLOUDINARY_WORK_ORDER_FOLDER: ${CLOUDINARY_WORK_ORDER_FOLDER:-scms/work-orders}
      CLOUDINARY_ASSESSMENT_FOLDER: ${CLOUDINARY_ASSESSMENT_FOLDER:-scms/assessments}
      CLOUDINARY_CONSUMABLE_REQUEST_FOLDER: ${CLOUDINARY_CONSUMABLE_REQUEST_FOLDER:-scms/consumable-requests}
      CLOUDINARY_SPARE_PART_REQUEST_FOLDER: ${CLOUDINARY_SPARE_PART_REQUEST_FOLDER:-scms/spare-part-requests}
      PDF_UPLOAD_DIR: ${PDF_UPLOAD_DIR:-uploads/pdf}
      EMPLOYEE_AVATAR_DIR: ${EMPLOYEE_AVATAR_DIR:-uploads/employees}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-20MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-20MB}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECURITY_LOG_LEVEL: ${SECURITY_LOG_LEVEL:-INFO}
      SQL_LOG_LEVEL: ${SQL_LOG_LEVEL:-WARN}
      LOG_PATH: ${LOG_PATH:-/var/log/scms}
      TZ: ${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=${APP_TIME_ZONE:-Asia/Ho_Chi_Minh}"
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://192.168.*:*}
    volumes:
      - scms_logs:/var/log/scms
      - ./uploads:/app/uploads
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_data:
  scms_logs:
